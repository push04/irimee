<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Indian Railways Official Wheel Logo — #003893 brand blue -->
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#003893" stroke-width="5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#003893" stroke-width="1.5"/>
  <!-- 24 spokes (matching Ashoka Chakra variant used by Indian Railways) -->
  <g stroke="#003893" stroke-width="2.2" stroke-linecap="round">
    <line x1="100" y1="16" x2="100" y2="82"/>
    <line x1="115.6" y1="16.8" x2="103.9" y2="82.2"/>
    <line x1="130.4" y1="19.5" x2="107.6" y2="83.8"/>
    <line x1="144.1" y1="24.5" x2="110.8" y2="86.4"/>
    <line x1="156.4" y1="31.7" x2="113.4" y2="90.0"/>
    <line x1="166.9" y1="40.5" x2="115.3" y2="94.4"/>
    <line x1="175.2" y1="51.2" x2="116.4" y2="99.3"/>
    <line x1="181.0" y1="63.1" x2="116.5" y2="104.3"/>
    <line x1="184.1" y1="75.9" x2="115.6" y2="109.1"/>
    <line x1="184.2" y1="89.3" x2="113.8" y2="113.4"/>
    <line x1="181.3" y1="102.4" x2="111.2" y2="117.1"/>
    <line x1="175.6" y1="114.6" x2="107.7" y2="120.0"/>
    <line x1="100" y1="184" x2="100" y2="118"/>
    <line x1="84.4" y1="183.2" x2="96.1" y2="117.8"/>
    <line x1="69.6" y1="180.5" x2="92.4" y2="116.2"/>
    <line x1="55.9" y1="175.5" x2="89.2" y2="113.6"/>
    <line x1="43.6" y1="168.3" x2="86.6" y2="110.0"/>
    <line x1="33.1" y1="159.5" x2="84.7" y2="105.6"/>
    <line x1="24.8" y1="148.8" x2="83.6" y2="100.7"/>
    <line x1="19.0" y1="136.9" x2="83.5" y2="95.7"/>
    <line x1="15.9" y1="124.1" x2="84.4" y2="90.9"/>
    <line x1="15.8" y1="110.7" x2="86.2" y2="86.6"/>
    <line x1="18.7" y1="97.6" x2="88.8" y2="82.9"/>
    <line x1="24.4" y1="85.4" x2="92.3" y2="80.0"/>
  </g>
  <!-- Hub -->
  <circle cx="100" cy="100" r="13" fill="#003893"/>
  <circle cx="100" cy="100" r="7"  fill="#FFFFFF"/>
  <!-- Inner tyre ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#003893" stroke-width="2.5"/>
  <!-- Text arcs -->
  <defs>
    <path id="topArc"    d="M 22,100 A 78,78 0 0,1 178,100"/>
    <path id="bottomArc" d="M 24,100 A 76,76 0 0,0 176,100"/>
  </defs>
  <text font-family="'DM Serif Display',Georgia,serif" font-size="12.5" font-weight="700"
        fill="#003893" letter-spacing="1.8">
    <textPath href="#topArc" startOffset="13%">INDIAN RAILWAYS</textPath>
  </text>
  <text font-family="'DM Sans',Arial,sans-serif" font-size="11.5" font-weight="600"
        fill="#003893" letter-spacing="1.2">
    <textPath href="#bottomArc" startOffset="22%">भारतीय रेल</textPath>
  </text>
</svg>
