<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <!-- IRIMEE Jamalpur — Indian Railway Institute of Mechanical & Electrical Engineering -->
  <!-- Outer border -->
  <circle cx="110" cy="110" r="105" fill="none" stroke="#003893" stroke-width="3"/>
  <circle cx="110" cy="110" r="99"  fill="none" stroke="#003893" stroke-width="1"/>
  <!-- Gear teeth (18 teeth) -->
  <g fill="#003893">
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(0   110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(20  110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(40  110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(60  110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(80  110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(100 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(120 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(140 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(160 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(180 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(200 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(220 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(240 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(260 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(280 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(300 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(320 110 110)"/>
    <rect x="107" y="5"   width="6"  height="14" rx="2" transform="rotate(340 110 110)"/>
  </g>
  <!-- Inner content circle -->
  <circle cx="110" cy="110" r="83" fill="#EEF2F9"/>
  <circle cx="110" cy="110" r="83" fill="none" stroke="#003893" stroke-width="2"/>
  <!-- Lightning bolt — electrical engineering -->
  <polygon points="122,44 96,102 114,102 98,176 134,108 115,108"
           fill="#003893" opacity="0.9"/>
  <!-- Cog dashes (mechanical engineering hint) -->
  <circle cx="110" cy="110" r="55" fill="none" stroke="#003893" stroke-width="1.5"
          stroke-dasharray="8 5"/>
  <!-- Hub -->
  <circle cx="110" cy="110" r="17" fill="#003893"/>
  <circle cx="110" cy="110" r="9"  fill="#FFFFFF"/>
  <circle cx="110" cy="110" r="3.5"fill="#003893"/>
  <!-- Text arcs -->
  <defs>
    <path id="iTop" d="M 27,110 A 83,83 0 0,1 193,110"/>
    <path id="iBot" d="M 32,110 A 78,78 0 0,0 188,110"/>
  </defs>
  <text font-family="'DM Serif Display',Georgia,serif" font-size="15" font-weight="700"
        fill="#003893" letter-spacing="3">
    <textPath href="#iTop" startOffset="12%">I R I M E E</textPath>
  </text>
  <text font-family="'DM Sans',Arial,sans-serif" font-size="11" font-weight="600"
        fill="#003893" letter-spacing="2.5">
    <textPath href="#iBot" startOffset="18%">J A M A L P U R</textPath>
  </text>
  <text x="110" y="182" text-anchor="middle"
        font-family="'DM Mono',monospace" font-size="9.5" fill="#4A5068">
    EST. 1878
  </text>
</svg>
